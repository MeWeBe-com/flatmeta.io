# FlatMeta: catch-all location for HestiaCP's generic "NodeJS" proxy template.
# Required: the template includes this file inside the domain's `server { }` block, after nodejs-app.conf.
# Everything not matched by nodejs-app.conf (/api/, /media/, /_next/static/, /sw.js) goes to Next.js.
#
# Port must equal WEB_PORT in .env (default 3200). The app binds to HOST=127.0.0.1, so only nginx reaches it.
location / {
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
}
