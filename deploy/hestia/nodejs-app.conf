# FlatMeta: per-domain proxy locations for HestiaCP's generic "NodeJS" proxy template.
# Proxy locations only: no http-level directives (map, upstream, limit_req_zone...) because
# this file is included inside the domain's `server { }` block.
#
# Ports are the defaults from .env.example. If you change WEB_PORT / PORT / MCP_PORT there, change them here.
#   WEB_PORT=3200   Next.js
#   PORT=3201       API (REST, WebSocket, /mcp, /docs)
# The catch-all `location /` (everything else → Next.js) lives in nodejs-app-fallback.conf, which the
# NodeJS template also includes. Ship both files.

# Same-origin API: browsers call /api/v1/... and the prefix is stripped before the API sees it.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3201/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 300s;
    proxy_buffering off;               # MCP and streaming responses

    # Live world: avatars, chat and activity run over a WebSocket on /api/v1/live.
    # Hestia's site template hides the Upgrade header, which breaks the handshake, so pass it through.
    proxy_pass_header Upgrade;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# Media uploaded by users and generated artwork (STORAGE_DRIVER=local).
# REPLACE the placeholder with the absolute value of MEDIA_DIR from .env, keeping the trailing slash,
# e.g. MEDIA_DIR=/home/flatmeta/flatmeta/apps/api/storage/media  →  alias /home/flatmeta/flatmeta/apps/api/storage/media/;
# Until it is replaced, every /media/ request returns 404 (images and avatars missing); nginx -t does NOT catch it.
location ^~ /media/ {
    alias __MEDIA_DIR__/;
    expires 365d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Next.js static assets: long cache.
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 365d;
    add_header Cache-Control "public, immutable";
}

# The service worker must never be cached for long, or updates stop arriving.
location = /sw.js {
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
}

# Files the app generates must reach the app. Hestia's template serves "static" extensions (.txt, .xml, ...)
# straight from public_html, so a missing or stale file there wins over the app (a deleted llms.txt gave nginx's
# 404). Exact-match and ^~ locations beat the template's regex location, whatever the include order.
# /sitemap.xml is the app's sitemap index (pages, plots, companies, insights); the insights articles are listed in
# /sitemap-insights.xml, which the app builds from the insights folder (INSIGHTS_DIR). A static
# public_html/sitemap.xml is never served.
location = /sitemap.xml   { proxy_pass http://127.0.0.1:3200; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
location = /llms.txt      { proxy_pass http://127.0.0.1:3200; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
location = /llms-full.txt { proxy_pass http://127.0.0.1:3200; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
location = /robots.txt    { proxy_pass http://127.0.0.1:3200; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
location ^~ /sitemap-     { proxy_pass http://127.0.0.1:3200; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
