# FlatMeta usercontent origin (G8): serves owner custom HTML as sandboxed documents, nothing else.
# Install as the proxy include of the usercontent.<domain> web domain (see docs/deploy-hestia.md → "Usercontent origin").
# Replace 3251 with the instance's API port (staging 3201, production 3251).
#
# Only two GET paths are proxied; everything else is 404 here. The API checks the Host header again
# (lib/usercontent.ts) and never reads cookies on this host.

location ~ ^/v1/(plots/[A-Za-z0-9-]{1,80}/sandbox|sandbox/preview/[A-Za-z0-9_-]{16,64})$ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:3251;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie "";          # never forward cookies to owner content
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
}

location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}

location / {
    return 404;
}
