<ion-header class="ion-no-border meta-page-header">
  <ion-toolbar class="meta-page-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/flatmeta/home" text="" icon="arrow-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title class="meta-page-title">
      <span class="gradient-text">Citizen Profile</span>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="profile-content">
  <div class="profile-container">
    <!-- Citizen Hologram Avatar Card -->
    <div class="avatar-hero-card meta-card-glass">
      <div class="avatar-display-wrap">
        <div class="avatar-ring-glow"></div>
        <img [src]="profileImg || 'assets/user.jpeg'" class="avatar-image-large" alt="Citizen Avatar" />
        <div class="avatar-badge-status">
          <span class="pulse-dot"></span>
          <span>Online Citizen</span>
        </div>
      </div>

      <div class="avatar-identity-info">
        <h2 class="profile-fullname">{{ profileForm.value.fullname || 'Metaverse Citizen' }}</h2>
        <span class="profile-username">@{{ profileForm.value.username }}</span>
        <div class="profile-role-tag">
          <span class="meta-badge badge-emerald">Verified Resident</span>
          <span class="meta-badge badge-cyan">Level 1 Owner</span>
        </div>
      </div>

      <!-- Avatar Action Buttons -->
      <div class="avatar-actions-bar">
        <ion-button fill="outline" class="btn-avatar-action" (click)="chooseFile()">
          <ion-icon name="cloud-upload-outline" slot="start"></ion-icon>
          Upload Photo
        </ion-button>
        <ion-button fill="outline" class="btn-avatar-action btn-dice" (click)="generateAvatar()">
          <ion-icon name="shuffle-outline" slot="start"></ion-icon>
          Dice Avatar
        </ion-button>
      </div>

      <input type="file" #fileInput (change)="choosePhoto($event)" hidden="true" accept="image/*"
        style="visibility: hidden; display: none;" />
    </div>

    <!-- Citizen Form Card -->
    <div class="profile-form-card meta-card-glass">
      <div class="card-section-head">
        <ion-icon name="id-card-outline"></ion-icon>
        <h3>Citizen Records</h3>
      </div>

      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" (keyup.enter)="onSubmit()" novalidate class="auth-form">
        <!-- Full Name -->
        <div class="input-group">
          <label class="input-label">Full Name</label>
          <div class="input-field-wrap" [class.field-error]="getControl.fullname.touched && getControl.fullname.invalid">
            <ion-icon name="person-outline" class="field-icon"></ion-icon>
            <ion-input placeholder="Enter Full Name" type="text" formControlName="fullname"></ion-input>
          </div>
          <div class="field-error-msg" *ngIf="getControl.fullname.touched && getControl.fullname.errors?.required">
            Full name is required
          </div>
        </div>

        <!-- Username (Readonly) -->
        <div class="input-group">
          <div class="label-row">
            <label class="input-label">Citizen Username</label>
            <span class="immutable-pill">Permanent Tag</span>
          </div>
          <div class="input-field-wrap field-readonly">
            <ion-icon name="at-outline" class="field-icon"></ion-icon>
            <ion-input placeholder="Username" type="text" formControlName="username" readonly></ion-input>
          </div>
        </div>

        <!-- Email Address (Readonly) -->
        <div class="input-group">
          <div class="label-row">
            <label class="input-label">Registered Email</label>
            <span class="immutable-pill">Verified</span>
          </div>
          <div class="input-field-wrap field-readonly">
            <ion-icon name="mail-outline" class="field-icon"></ion-icon>
            <ion-input placeholder="Email" type="email" formControlName="email" readonly></ion-input>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="form-actions">
          <ion-button expand="block" class="meta-btn-gradient btn-update-profile" type="submit" [disabled]="profileForm.invalid">
            <ion-icon name="checkmark-done-outline" slot="start"></ion-icon>
            Update Citizen Records
          </ion-button>
        </div>
      </form>
    </div>

    <!-- Hidden 3D Avatar Render Canvas Container -->
    <div id="canvasRen" style="width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden;"></div>
  </div>
</ion-content>
