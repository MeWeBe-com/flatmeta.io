<ion-header class="ion-no-border meta-header">
  <ion-toolbar class="meta-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" text="" icon="arrow-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title class="meta-title">Save Citizen Account</ion-title>
    <ion-buttons slot="end">
      <ion-button [routerLink]="['/']" fill="clear" title="Close and return to Map">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="signup-content">
  <div class="auth-wrapper">
    <!-- Ambient Cyber Glows -->
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="auth-card meta-card-glass">
      <div class="auth-header">
        <div class="auth-logo-badge">
          <ion-icon name="person-add"></ion-icon>
        </div>
        <h2 class="auth-title">Save to <span class="gradient-text">FlatMeta</span></h2>
        <p class="auth-subtitle">
          Enter your email to permanently save your <strong>100 Free Squares</strong>, custom land artwork, pins, and avatar. Password is optional!
        </p>
      </div>

      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" (keyup.enter)="onSubmit()" novalidate class="auth-form">
        <!-- Email (Only required field per Brief 06/01/23) -->
        <div class="input-group">
          <label class="input-label">Email Address *</label>
          <div class="input-field-wrap" [class.field-error]="getControl.email.touched && getControl.email.invalid">
            <ion-icon name="mail-outline" class="field-icon"></ion-icon>
            <ion-input placeholder="you@flatmeta.io" type="email" formControlName="email"></ion-input>
          </div>
          <div class="field-error-msg" *ngIf="getControl.email.touched && getControl.email.invalid">
            Please enter a valid email address
          </div>
        </div>

        <!-- Citizen Username (Optional - auto-derived from email if blank) -->
        <div class="input-group">
          <label class="input-label">Citizen Username (Optional)</label>
          <div class="input-field-wrap">
            <ion-icon name="at-outline" class="field-icon"></ion-icon>
            <ion-input placeholder="satoshi" type="text" formControlName="username"></ion-input>
          </div>
        </div>

        <!-- Full Name (Optional) -->
        <div class="input-group">
          <label class="input-label">Display Name (Optional)</label>
          <div class="input-field-wrap">
            <ion-icon name="person-outline" class="field-icon"></ion-icon>
            <ion-input placeholder="Satoshi Nakamoto" type="text" formControlName="fullname"></ion-input>
          </div>
        </div>

        <!-- Optional Password -->
        <div class="input-group">
          <label class="input-label">Password (Optional)</label>
          <div class="input-field-wrap">
            <ion-icon name="lock-closed-outline" class="field-icon"></ion-icon>
            <ion-input placeholder="Leave blank for passwordless email login" [type]="showPass ? 'text' : 'password'" formControlName="password">
            </ion-input>
            <button type="button" class="btn-toggle-pass" (click)="showPass = !showPass" aria-label="Toggle password">
              <ion-icon [name]="showPass ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="form-actions">
          <ion-button expand="block" class="meta-btn-gradient auth-btn-submit" [disabled]="signupForm.invalid" type="submit">
            Verify Email & Save Account
            <ion-icon name="sparkles-outline" slot="end"></ion-icon>
          </ion-button>
        </div>
      </form>

      <!-- Bottom Alternative -->
      <div class="auth-footer-note">
        <span>Already registered?</span>
        <a [routerLink]="['/login']" class="signup-link">Sign In</a>
        <span style="margin: 0 6px;">•</span>
        <a [routerLink]="['/']" class="signup-link">Back to Map</a>
      </div>
    </div>
  </div>
</ion-content>
