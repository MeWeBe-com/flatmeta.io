<ion-header class="ion-no-border meta-page-header">
  <ion-toolbar class="meta-page-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" text="" icon="arrow-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title class="meta-page-title">
      <span class="gradient-text">Transaction Complete</span>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="thankyou-content">
  <div class="thankyou-wrapper">
    <div class="thankyou-card meta-card-glass">
      <div class="celebration-icon-box">
        <ion-icon name="checkmark-done-circle"></ion-icon>
        <span class="pulse-ring"></span>
      </div>

      <h2 class="thankyou-title">Deed <span class="gradient-text">Acquired!</span></h2>
      <p class="thankyou-subtitle">
        Your land parcels have been transferred to your citizen profile and registered in the FlatMeta database.
      </p>

      <div class="deed-status-card">
        <div class="status-row">
          <span class="s-lbl">Transaction Status:</span>
          <span class="meta-badge badge-emerald">Settled & Confirmed</span>
        </div>
        <div class="status-row">
          <span class="s-lbl">Access Privileges:</span>
          <span class="s-val">Custom Artwork, Multi-Tile Span & Custom URL</span>
        </div>
      </div>

      <div class="thankyou-actions">
        <ion-button expand="block" class="meta-btn-gradient btn-return-world" [routerLink]="['/']">
          <ion-icon name="planet-outline" slot="start"></ion-icon>
          Return to Metaverse Map
        </ion-button>
        <ion-button expand="block" fill="outline" class="btn-view-portfolio" [routerLink]="['/myplaces']">
          <ion-icon name="cube-outline" slot="start"></ion-icon>
          View in My Land Portfolio
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
