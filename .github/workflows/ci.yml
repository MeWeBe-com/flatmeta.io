# One workflow: tests on every push and pull request, then a deploy job on pushes to v2.
# The deploy lives in this file on purpose: GitHub only honours workflow_run and workflow_dispatch
# triggers from the default branch, and this project works on v2.
name: CI

on:
  push:
    branches: [v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flatmeta
          POSTGRES_PASSWORD: flatmeta
          POSTGRES_DB: flatmeta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flatmeta -d flatmeta_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://flatmeta:flatmeta@localhost:5432/flatmeta_test
      REDIS_URL_TEST: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and API tests (real Postgres, Redis and WebSockets)
        run: npm test
      - name: Build
        env:
          APP_URL: https://ci.example.test
        run: npm run build

      # Production renders different pages (payments off: "coming soon"; indexing on). Build them too, so a
      # launch-only code path can't break the production deploy.
      - name: Build the web app with production launch settings
        env:
          NODE_ENV: production
          APP_ENV: production
          APP_URL: https://flatmeta.io
        run: cd apps/web && NEXT_DIST_DIR=.next-prodcheck npx next build && rm -rf .next-prodcheck

      # Smoke tests against the built app: API (compiled) + worker + web (next start), seeded database, behind
      # scripts/edge-proxy.mjs, which routes /api (WebSockets included) like the Hestia nginx config does.
      - name: Start the stack
        env:
          APP_URL: http://localhost:8080
          DATABASE_URL: postgres://flatmeta:flatmeta@localhost:5432/flatmeta_test
          REDIS_URL: redis://localhost:6379/14
          SESSION_SECRET: ci-only-secret
          API_INTERNAL_URL: http://127.0.0.1:3201
          # The e2e suite signs in dozens of players from one IP; production keeps the default (10/min).
          AUTH_RATE_LIMIT_PER_MINUTE: '200'
        run: |
          NODE_ENV=development npm run db:migrate
          NODE_ENV=development npm run db:seed
          # NODE_ENV=development only for the API (it allows the localhost APP_URL); Next runs its own production build.
          NODE_ENV=development nohup node apps/api/dist/src/server.js > api.log 2>&1 &
          NODE_ENV=development nohup node apps/api/dist/src/worker.js > worker.log 2>&1 &
          nohup npm run start:web > web.log 2>&1 &
          EDGE_PORT=8080 WEB_INTERNAL_URL=http://127.0.0.1:3200 nohup node scripts/edge-proxy.mjs > edge.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/v1/live/health >/dev/null && curl -fsS http://127.0.0.1:8080/robots.txt >/dev/null && exit 0
            sleep 2
          done
          echo "stack did not start"; tail -n 50 api.log web.log edge.log; exit 1
      # Chromium comes from Playwright's CDN. The system libraries are normally already on ubuntu-latest, so apt (whose
      # mirror on the runners is sometimes unreachable for a long time) runs only when Chromium can't start without it.
      - name: Install Chromium for Playwright
        timeout-minutes: 20
        run: |
          npx playwright install chromium
          if node -e "require('@playwright/test').chromium.launch().then((b) => b.close()).catch(() => process.exit(1))"; then
            echo "Chromium starts: no system packages needed"
          else
            for i in 1 2 3; do timeout 300 npx playwright install-deps chromium && exit 0; echo "install-deps failed (attempt $i), retrying"; sleep 20; done; exit 1
          fi
      - name: End-to-end smoke tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: tail -n 80 api.log worker.log web.log edge.log || true

  deploy:
    # Runs only after the tests pass, only on a push to v2, and only when the server secrets exist.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-v2
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ] || [ -z "$DEPLOY_KEY" ]; then
            echo "::notice title=Deploy skipped::Set the repository secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY and DEPLOY_PATH (optional DEPLOY_PORT) to deploy after each push to v2."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up SSH
        if: steps.check.outputs.run == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy over SSH
        if: steps.check.outputs.run == 'true'
        # The server key can be restricted with a forced command; either way the server runs scripts/deploy.sh on branch v2.
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && bash scripts/deploy.sh v2"
