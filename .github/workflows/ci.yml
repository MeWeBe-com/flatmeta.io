# One workflow: tests on every push and pull request, then a deploy job on pushes to v2.
# The deploy lives in this file on purpose: GitHub only honours workflow_run and workflow_dispatch
# triggers from the default branch, and this project works on v2.
name: CI

on:
  push:
    branches: [v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flatmeta
          POSTGRES_PASSWORD: flatmeta
          POSTGRES_DB: flatmeta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flatmeta -d flatmeta_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://flatmeta:flatmeta@localhost:5432/flatmeta_test
      REDIS_URL_TEST: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and API tests (real Postgres, Redis and WebSockets)
        run: npm test
      - name: Build
        env:
          APP_URL: https://ci.example.test
          # The e2e stack's API runs in development mode with mock payments: build the web app to match.
          PAID_CHECKOUT_ENABLED: 'true'
        run: npm run build

      # Production renders different pages (payments off: "coming soon"; indexing on). Build them too, so a
      # launch-only code path can't break the production deploy.
      - name: Build the web app with production launch settings
        env:
          NODE_ENV: production
          APP_ENV: production
          APP_URL: https://flatmeta.io
        run: cd apps/web && NEXT_DIST_DIR=.next-prodcheck npx next build && rm -rf .next-prodcheck

      # Smoke tests against the built app: API (compiled) + worker + web (next start), seeded database, behind
      # scripts/edge-proxy.mjs, which routes /api (WebSockets included) like the Hestia nginx config does.
      - name: Start the stack
        env:
          APP_URL: http://localhost:8080
          DATABASE_URL: postgres://flatmeta:flatmeta@localhost:5432/flatmeta_test
          REDIS_URL: redis://localhost:6379/14
          SESSION_SECRET: ci-only-secret
          API_INTERNAL_URL: http://127.0.0.1:3201
          # The e2e suite signs in dozens of players from one IP; production keeps the default (10/min).
          AUTH_RATE_LIMIT_PER_MINUTE: '200'
        run: |
          NODE_ENV=development npm run db:migrate
          NODE_ENV=development npm run db:seed
          # NODE_ENV=development only for the API (it allows the localhost APP_URL); Next runs its own production build.
          NODE_ENV=development nohup node apps/api/dist/src/server.js > api.log 2>&1 &
          NODE_ENV=development nohup node apps/api/dist/src/worker.js > worker.log 2>&1 &
          nohup npm run start:web > web.log 2>&1 &
          EDGE_PORT=8080 WEB_INTERNAL_URL=http://127.0.0.1:3200 nohup node scripts/edge-proxy.mjs > edge.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/v1/live/health >/dev/null && curl -fsS http://127.0.0.1:8080/robots.txt >/dev/null && exit 0
            sleep 2
          done
          echo "stack did not start"; tail -n 50 api.log web.log edge.log; exit 1
      # Chromium comes from Playwright's CDN. The system libraries are normally already on ubuntu-latest, so apt (whose
      # mirror on the runners is sometimes unreachable for a long time) runs only when Chromium can't start without it.
      - name: Install Chromium for Playwright
        timeout-minutes: 20
        run: |
          npx playwright install chromium
          if node -e "require('@playwright/test').chromium.launch().then((b) => b.close()).catch(() => process.exit(1))"; then
            echo "Chromium starts: no system packages needed"
          else
            for i in 1 2 3; do timeout 300 npx playwright install-deps chromium && exit 0; echo "install-deps failed (attempt $i), retrying"; sleep 20; done; exit 1
          fi
      # WebKit for the mobile device matrix (Safari handles 100vh, safe areas and fixed elements differently).
      - name: Install WebKit for Playwright
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do timeout 600 npx playwright install --with-deps webkit && exit 0; echo "webkit install failed (attempt $i), retrying"; sleep 20; done; exit 1
      - name: End-to-end smoke tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Mobile matrix screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-matrix
          path: apps/web/test-results/mobile
          if-no-files-found: ignore
          retention-days: 14
      - name: Logs on failure
        if: failure()
        run: tail -n 80 api.log worker.log web.log edge.log || true

  deploy:
    # Runs only after the tests pass, only on a push to v2, and only when the server secrets exist.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-v2
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.check.outputs.run }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ] || [ -z "$DEPLOY_KEY" ]; then
            echo "::notice title=Deploy skipped::Set the repository secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY and DEPLOY_PATH (optional DEPLOY_PORT) to deploy after each push to v2."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up SSH
        if: steps.check.outputs.run == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy over SSH
        if: steps.check.outputs.run == 'true'
        # The server key can be restricted with a forced command; either way the server runs scripts/deploy.sh on branch v2.
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && bash scripts/deploy.sh staging --ci v2"

  # Staging smoke test (public checks, no account needed) against the commit just deployed to staging.
  smoke-staging:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        timeout-minutes: 15
        run: |
          npx playwright install chromium
          if ! node -e "require('playwright').chromium.launch().then((b) => b.close()).catch(() => process.exit(1))"; then
            for i in 1 2 3; do timeout 300 npx playwright install-deps chromium && exit 0; sleep 20; done; exit 1
          fi
      - name: Smoke test https://staging.flatmeta.io
        run: node scripts/release-smoke.cjs https://staging.flatmeta.io

  # Production: the same commit, only after staging passed its smoke test. Needs the PROD_DEPLOY_* secrets and
  # AUTO_DEPLOY=true in the production .env (see docs/deploy-hestia.md → Automatic production deploys).
  deploy-production:
    needs: smoke-staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      statuses: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PROD_DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
      PROD_DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
      PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
      PROD_DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
      PROD_DEPLOY_PORT: ${{ secrets.PROD_DEPLOY_PORT }}
      SHA: ${{ github.sha }}
    steps:
      - name: Check production deploy secrets
        id: check
        run: |
          if [ -z "$PROD_DEPLOY_HOST" ] || [ -z "$PROD_DEPLOY_USER" ] || [ -z "$PROD_DEPLOY_PATH" ] || [ -z "$PROD_DEPLOY_KEY" ]; then
            echo "::notice title=Production deploy skipped::Set the repository secrets PROD_DEPLOY_HOST, PROD_DEPLOY_USER, PROD_DEPLOY_PATH and PROD_DEPLOY_KEY (optional PROD_DEPLOY_PORT), and AUTO_DEPLOY=true in the production .env, to deploy production automatically after staging passes."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up SSH
        if: steps.check.outputs.run == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$PROD_DEPLOY_KEY" > ~/.ssh/prod_key && chmod 600 ~/.ssh/prod_key
          ssh-keyscan -p "${PROD_DEPLOY_PORT:-22}" -H "$PROD_DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy ${{ github.sha }} to production
        id: deploy
        if: steps.check.outputs.run == 'true'
        # With the recommended forced command the server ignores everything but the SHA in this command line.
        # deploy.sh: pg_dump → migrate → health checks → roll back on failure; it emails the admins either way.
        run: |
          set +e
          ssh -i ~/.ssh/prod_key -p "${PROD_DEPLOY_PORT:-22}" -o BatchMode=yes -o ServerAliveInterval=30 "$PROD_DEPLOY_USER@$PROD_DEPLOY_HOST" \
            "cd '$PROD_DEPLOY_PATH' && bash scripts/deploy.sh production --auto --commit $SHA"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case $code in
            0) echo "::notice title=Production deployed::${SHA:0:7} is live." ;;
            1) echo "::error title=Production deploy failed::${SHA:0:7} failed its checks; production was rolled back and the commit is recorded as failed (never retried automatically)." ;;
            *) echo "::error title=Production deploy refused::The server refused or aborted the deploy of ${SHA:0:7} before changing anything (exit $code): check AUTO_DEPLOY=true, the key, and the deploy log." ;;
          esac
          exit $code
      - name: Record the result on the commit
        if: always() && steps.check.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.deploy.outputs.code }}
        run: |
          case "$CODE" in 0) state=success; desc="Deployed to production" ;; 1) state=failure; desc="Failed in production: rolled back" ;; *) state=error; desc="Production deploy refused or aborted" ;; esac
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"deploy/production\",\"description\":\"$desc\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" >/dev/null
