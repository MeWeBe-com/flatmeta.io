# Tests on every push and pull request. Nothing deploys from here (AD2, 18 Nov 2026): each server deploys itself
# from GitHub with a cron job that builds and tests every new commit in a fresh release folder before switching
# (scripts/autodeploy, docs/deploy/AUTO-DEPLOY.md). This workflow is a second opinion, not a gate.
name: CI

on:
  push:
    branches: [v2, production]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flatmeta
          POSTGRES_PASSWORD: flatmeta
          POSTGRES_DB: flatmeta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flatmeta -d flatmeta_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://flatmeta:flatmeta@localhost:5432/flatmeta_test
      REDIS_URL_TEST: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and API tests (real Postgres, Redis and WebSockets)
        run: npm test
        env:
          # GL4: optional. A Stripe TEST secret key (sk_test_…) from the FlatMeta account runs the real test-mode check in
          # apps/api/test/stripe-testmode.test.ts; without it that test is skipped. Never a live key.
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      - name: Build
        env:
          APP_URL: https://ci.example.test
          # The e2e stack's API runs in development mode with mock payments: build the web app to match.
          PAID_CHECKOUT_ENABLED: 'true'
        run: npm run build

      # Production renders different pages (payments off: "coming soon"; indexing on). Build them too, so a
      # launch-only code path can't break the production deploy.
      - name: Build the web app with production launch settings
        env:
          NODE_ENV: production
          APP_ENV: production
          APP_URL: https://flatmeta.io
        run: cd apps/web && NEXT_DIST_DIR=.next-prodcheck npx next build && rm -rf .next-prodcheck

      # Smoke tests against the built app: API (compiled) + worker + web (next start), seeded database, behind
      # scripts/edge-proxy.mjs, which routes /api (WebSockets included) like the Hestia nginx config does.
      - name: Start the stack
        env:
          APP_URL: http://localhost:8080
          DATABASE_URL: postgres://flatmeta:flatmeta@localhost:5432/flatmeta_test
          REDIS_URL: redis://localhost:6379/14
          SESSION_SECRET: ci-only-secret
          API_INTERNAL_URL: http://127.0.0.1:3201
          # The e2e suite signs in dozens of players from one IP; production keeps the default (10/min).
          AUTH_RATE_LIMIT_PER_MINUTE: '200'
          # One IP runs every e2e project in parallel (the device matrix alone opens ~200 pages): lift the general limit too.
          RATE_LIMIT_PER_MINUTE: '6000'
          RATE_LIMIT_SCALE: '50'
          # S1: the insights articles the app lists in /sitemap-insights.xml (production: public_html/insights).
          INSIGHTS_DIR: ${{ github.workspace }}/apps/web/test/fixtures/insights
        run: |
          NODE_ENV=development npm run db:migrate
          NODE_ENV=development npm run db:seed
          # NODE_ENV=development only for the API (it allows the localhost APP_URL); Next runs its own production build.
          NODE_ENV=development nohup node apps/api/dist/src/server.js > api.log 2>&1 &
          NODE_ENV=development nohup node apps/api/dist/src/worker.js > worker.log 2>&1 &
          nohup npm run start:web > web.log 2>&1 &
          EDGE_PORT=8080 WEB_INTERNAL_URL=http://127.0.0.1:3200 nohup node scripts/edge-proxy.mjs > edge.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/v1/live/health >/dev/null && curl -fsS http://127.0.0.1:8080/robots.txt >/dev/null && exit 0
            sleep 2
          done
          echo "stack did not start"; tail -n 50 api.log web.log edge.log; exit 1
      # Chromium comes from Playwright's CDN. The system libraries are normally already on ubuntu-latest, so apt (whose
      # mirror on the runners is sometimes unreachable for a long time) runs only when Chromium can't start without it.
      - name: Install Chromium for Playwright
        timeout-minutes: 20
        run: |
          npx playwright install chromium
          if node -e "require('@playwright/test').chromium.launch().then((b) => b.close()).catch(() => process.exit(1))"; then
            echo "Chromium starts: no system packages needed"
          else
            for i in 1 2 3; do timeout 300 npx playwright install-deps chromium && exit 0; echo "install-deps failed (attempt $i), retrying"; sleep 20; done; exit 1
          fi
      # WebKit for the mobile device matrix (Safari handles 100vh, safe areas and fixed elements differently).
      - name: Install WebKit for Playwright
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do timeout 600 npx playwright install --with-deps webkit && exit 0; echo "webkit install failed (attempt $i), retrying"; sleep 20; done; exit 1
      # S1: the sitemap tests validate every sitemap against the official XSDs with xmllint.
      - name: xmllint
        run: command -v xmllint || (sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils)
      # M2: Lighthouse mobile budget on the home page and a plot page (LCP < 2.5 s, TBT < 300 ms, CLS < 0.1). CI has no GPU, so the budget runs
      # without WebGL: see scripts/lighthouse-budget.mjs for why and what it covers. It runs before the end-to-end tests, on the
      # freshly seeded database: those tests change and remove plots, and a quiet machine gives steadier numbers. @plot is the
      # first plot page in the plot sitemap (a fixed slug can be hidden under the production launch settings CI builds with).
      - name: Lighthouse mobile budget
        run: CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" LH_PAGES=/,@plot node scripts/lighthouse-budget.mjs http://localhost:8080 --out apps/web/test-results/lighthouse
      - name: End-to-end smoke tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Mobile matrix screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-matrix
          path: |
            apps/web/test-results/mobile
            apps/web/test-results/lighthouse
          if-no-files-found: ignore
          retention-days: 14
      - name: Logs on failure
        if: failure()
        run: tail -n 80 api.log worker.log web.log edge.log || true
